services: 
  frontend:
    container_name: copycat_frontend
    volumes:
      - ./client:/app
    build:
      context: ./client/
      dockerfile: ./Dockerfile
    ports:
      - "5173:5173"
    depends_on: [backend] 
    networks:
      copycat_net:
        ipv4_address: 192.168.25.50
  backend:
    env_file:
      - ./server/.env
      - .env
    container_name: copycat_backend
    volumes:
      - ./server:/app
    build:
      context: ./server
      dockerfile: ./Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      copycat_net:
        ipv4_address: 192.168.25.100
  database:
    container_name: copycat_database
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/docker-entrypoint-initdb.d/:ro
      - db_data:/var/lib/postgresql/data
    environment:
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_DB: copycat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      PGUSER: ${PGUSER}
    networks:
      copycat_net:
        ipv4_address: 192.168.25.150
    healthcheck:
      test: pg_isready -d copycat
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
  networker:
    container_name: copycat_networker
    image: jonlabelle/network-tools:latest
    command: "sleep 3600"
    networks:
      copycat_net:
        ipv4_address: 192.168.25.151

volumes:
  db_data:

networks:
  copycat_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.25.0/24
          gateway: 192.168.25.1

