pre-commit:
  commands:
    check:
      glob: "server/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npm exec --prefix=server -- biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
pre-push:
  commands:
    check:
      glob: "server/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npm exec --prefix=server -- biome check --no-errors-on-unmatched --files-ignore-unknown=true {push_files}
